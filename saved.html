<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Saved &mdash; ShopMax</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Mukta:300,400,700">
    <link rel="stylesheet" href="fonts/icomoon/style.css">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/magnific-popup.css">
    <link rel="stylesheet" href="css/jquery-ui.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/owl.theme.default.min.css">

    <link rel="stylesheet" href="css/aos.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/custom.css">
  </head>
  <body>

  <div class="site-wrap">

    <div data-sm-navbar></div>

    <!-- Breadcrumb -->
    <div class="bg-light py-2">
      <div class="container">
        <div class="row">
          <div class="col-md-12 mb-0">
            <a href="/index.html">Home</a> <span class="mx-2 mb-0">/</span>
            <strong class="text-black">Saved</strong>
          </div>
        </div>
      </div>
    </div>

    <div class="site-section pt-0">
      <div class="container">

        <div class="d-flex flex-wrap align-items-center justify-content-between mb-2">
          <h2 class="h3 mb-0" style="font-weight:700;color:#1f1f1f;">Saved</h2>
        </div>
        <p class="text-muted" style="font-size:14px;">
          Everything you have hearted or bookmarked from the <a href="/marketplace.html">Community Marketplace</a>.
          Your <strong>wishlist</strong> holds the designs you love; <strong>Saved for later</strong> holds the ones you
          want to come back to. An item can be in both &mdash; removing it from one list never removes it from the other.
        </p>

        <!-- One page, two internal tabs. Switching tabs re-renders the grid only. -->
        <div class="sm-mk-tabs sm-saved-tabs" id="sm-saved-tabs">
          <button class="sm-mk-tab sm-saved-tab active" data-tab="wishlist">❤️ Wishlist</button>
          <button class="sm-mk-tab sm-saved-tab" data-tab="saved">🔖 Saved for later</button>
          <span class="sm-mk-count" id="sm-saved-count"></span>
        </div>

        <div class="row" id="sm-saved-grid">
          <div class="col-12 sm-loading">Loading&hellip;</div>
        </div>

      </div>
    </div>

    <div data-sm-footer></div>
  </div>

  <script src="js/jquery-3.3.1.min.js"></script>
  <script src="js/jquery-ui.js"></script>
  <script src="js/popper.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/owl.carousel.min.js"></script>
  <script src="js/jquery.magnific-popup.min.js"></script>
  <script src="js/aos.js"></script>

  <script src="js/main.js"></script>
  <script src="js/app.js"></script>
  <!-- Provides SM.marketplace.cardHTML/heartIcon/saveIcon/bindToggles and the
       global smInitFallback used by card thumbnails. -->
  <script src="js/marketplace.js"></script>
  <script src="js/saved.js"></script>
  </body>
</html>
